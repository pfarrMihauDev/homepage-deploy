services:
  db:
    image: mcr.microsoft.com/mssql/server:2019-latest   # 2022 seems to have a problem with the linux kernel of the server
    ports:
      - "1433:1433"
    user: root
    environment:
      - SA_PASSWORD=TestP4ssword?
      - ACCEPT_EULA=Y
    volumes:
      - db:/var/opt/mssql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  frontend:
    image: greedygrinner1/syp024b06frontend:1.1
    ports:
      - "80:80"
    volumes:
      - ./certs:/etc/ssl/certs

  backend:
    image: greedygrinner1/syp024b06backend:1.2
    ports:
      - "7000:7000"
    depends_on:
      - db
    links:
      - db

volumes:
  db:
    driver: local